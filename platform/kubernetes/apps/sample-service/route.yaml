apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample-service
  namespace: spm
  labels:
    app.kubernetes.io/name: sample-service
    app.kubernetes.io/part-of: spm
spec:
  parentRefs:
    - name: spm-gateway
      sectionName: http
  hostnames:
    - api.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sample-service
          port: 80
