apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: spm-gateway
  namespace: spm
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample-service
  namespace: spm
spec:
  hostnames:
    - api-dev.example.com
