name: Tests

on:
  push:
    paths:
      - "apps/**"
      - "services/**"
      - "development/**"
      - "docs/ci-process.md"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "apps/**"
      - "services/**"
      - "development/**"
      - "docs/ci-process.md"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-unit-tests:
    name: Component Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run component unit test entrypoints
        shell: bash
        run: |
          set -eu

          collect_failure_diagnostics() {
            local component_dir="$1"
            local npm_log_dir="${NPM_CONFIG_CACHE:-$HOME/.npm}/_logs"
            local artifact_dir="$GITHUB_WORKSPACE/ci-diagnostics/$component_dir"

            mkdir -p "$artifact_dir"
            {
              echo "Git commit: $(git rev-parse HEAD)"
              echo "Node version: $(node --version)"
              echo "npm version: $(npm --version)"
              echo "legacy-peer-deps: $(npm config get legacy-peer-deps)"
              echo "strict-peer-deps: $(npm config get strict-peer-deps)"
              echo "Dependency files:"
              sha256sum "$component_dir/package.json" "$component_dir/package-lock.json"
            } > "$artifact_dir/dependency-state.txt"

            if [ -d "$npm_log_dir" ]; then
              find "$npm_log_dir" -type f -name '*-debug-*.log' -exec cp {} "$artifact_dir/" \;
            fi
          }

          entrypoints="$(
            find apps services \
              -path "*/scripts/ci/unit-test.sh" -type f -print | sort
          )"

          if [ -z "$entrypoints" ]; then
            echo "No component unit-test entrypoints found."
            echo "Add scripts/ci/unit-test.sh under an implemented app or service when tests exist."
            exit 0
          fi

          for entrypoint in $entrypoints; do
            component_dir="$(dirname "$(dirname "$(dirname "$entrypoint")")")"

            if [ ! -x "$entrypoint" ]; then
              echo "CI unit test entrypoint is not executable: $entrypoint"
              echo "Run: chmod +x $entrypoint"
              exit 1
            fi

            echo "Running unit tests for $component_dir"
            set +e
            (
              cd "$component_dir"
              ./scripts/ci/unit-test.sh
            )
            status=$?
            set -e

            if [ "$status" -ne 0 ]; then
              echo "Unit tests failed for $component_dir with exit code $status"
              collect_failure_diagnostics "$component_dir"
              exit "$status"
            fi
          done

  backend-e2e-tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    env:
      GCLOUD_PROJECT: demo-is212
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      DATABASE_URL: postgresql://spm:spm_dev_password@127.0.0.1:5432/spm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: services/backend

      - name: Build local PostgreSQL image
        run: docker build -t spm-postgresql ./development/database/postgresql

      - name: Start PostgreSQL
        run: |
          docker run -d --name spm-postgres \
            -e POSTGRES_USER=spm \
            -e POSTGRES_PASSWORD=spm_dev_password \
            -e POSTGRES_DB=spm \
            -p 5432:5432 \
            spm-postgresql

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker exec spm-postgres pg_isready -U spm -d spm; then
              exit 0
            fi
            sleep 1
          done
          docker logs spm-postgres
          exit 1

      - name: Run E2E tests with Firebase Auth Emulator
        run: npx firebase-tools@latest emulators:exec --config ../../development/local-dev/firebase/firebase.json --only auth --project demo-is212 "npm run test:e2e"
        working-directory: services/backend

      - name: Remove PostgreSQL test container
        if: always()
        run: docker rm -f spm-postgres || true
      - name: Upload npm diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs-${{ github.run_id }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
