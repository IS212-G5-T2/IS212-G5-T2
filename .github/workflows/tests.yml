name: Tests

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "apps/**"
      - "services/**"
      - "development/**"
      - "docs/ci-process.md"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "apps/**"
      - "services/**"
      - "development/**"
      - "docs/ci-process.md"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-unit-tests:
    name: Component Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run component unit test entrypoints
        shell: bash
        run: |
          set -eu

          entrypoints="$(
            find apps services \
              -path "*/scripts/ci/unit-test.sh" -type f -print | sort
          )"

          if [ -z "$entrypoints" ]; then
            echo "No component unit-test entrypoints found."
            echo "Add scripts/ci/unit-test.sh under an implemented app or service when tests exist."
            exit 0
          fi

          for entrypoint in $entrypoints; do
            component_dir="$(dirname "$(dirname "$(dirname "$entrypoint")")")"

            if [ ! -x "$entrypoint" ]; then
              echo "CI unit test entrypoint is not executable: $entrypoint"
              echo "Run: chmod +x $entrypoint"
              exit 1
            fi

            echo "Running unit tests for $component_dir"
            (
              cd "$component_dir"
              ./scripts/ci/unit-test.sh
            )
          done

  backend-e2e-tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    env:
      GCLOUD_PROJECT: demo-is212
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      DATABASE_URL: postgresql://spm:spm_dev_password@127.0.0.1:5432/spm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: services/backend

      - name: Build local PostgreSQL image
        run: docker build -t spm-postgresql ./development/database/postgresql

      - name: Start PostgreSQL
        run: |
          docker run -d --name spm-postgres \
            -e POSTGRES_USER=spm \
            -e POSTGRES_PASSWORD=spm_dev_password \
            -e POSTGRES_DB=spm \
            -p 5432:5432 \
            spm-postgresql

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker exec spm-postgres pg_isready -U spm -d spm; then
              exit 0
            fi
            sleep 1
          done
          docker logs spm-postgres
          exit 1

      - name: Run E2E tests with Firebase Auth Emulator
        run: npx firebase-tools@latest emulators:exec --config ../../firebase.json --only auth --project demo-is212 "npm run test:e2e"
        working-directory: services/backend

      - name: Remove PostgreSQL test container
        if: always()
        run: docker rm -f spm-postgres || true
