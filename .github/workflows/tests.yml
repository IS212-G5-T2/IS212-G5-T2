name: Tests

on:
  push:
    paths:
      - "apps/**"
      - "services/**"
      - "development/**"
      - "docs/ci-process.md"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "apps/**"
      - "services/**"
      - "development/**"
      - "docs/ci-process.md"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-unit-tests:
    name: Component Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run component unit test entrypoints
        shell: bash
        run: |
          set -eu

          print_node_diagnostics() {
            local component_dir="$1"

            if [ ! -f "$component_dir/package.json" ]; then
              return 0
            fi

            echo "Node version: $(node --version)"
            echo "npm version: $(npm --version)"
            echo "Declared TypeScript version: $(node -e "console.log(require('./$component_dir/package.json').devDependencies?.typescript ?? require('./$component_dir/package.json').dependencies?.typescript ?? 'not declared')")"

            if [ -f "$component_dir/package-lock.json" ]; then
              node -e "const lock = require('./$component_dir/package-lock.json'); console.log('Lockfile TypeScript version:', lock.packages?.['node_modules/typescript']?.version ?? lock.dependencies?.typescript?.version ?? 'not present')"
            fi

            if [ -x "$component_dir/node_modules/.bin/tsc" ]; then
              echo "Installed TypeScript version: $(cd "$component_dir" && ./node_modules/.bin/tsc --version)"
            else
              echo "Installed TypeScript version: not available (dependency installation did not complete)"
            fi
          }

          print_npm_debug_logs() {
            local npm_log_dir="${NPM_CONFIG_CACHE:-$HOME/.npm}/_logs"
            local component_dir="$1"
            local artifact_dir="$GITHUB_WORKSPACE/ci-diagnostics/$component_dir"

            echo "npm debug logs in $npm_log_dir:"
            mkdir -p "$artifact_dir"

            if [ -d "$npm_log_dir" ]; then
              find "$npm_log_dir" -type f -name '*-debug-*.log' -print -exec sh -c 'echo "--- $1"; cat "$1"; cp "$1" "$2/"' _ {} "$artifact_dir" \;
            else
              echo "No npm debug logs found."
            fi
          }

          entrypoints="$(
            find apps services \
              -path "*/scripts/ci/unit-test.sh" -type f -print | sort
          )"

          if [ -z "$entrypoints" ]; then
            echo "No component unit-test entrypoints found."
            echo "Add scripts/ci/unit-test.sh under an implemented app or service when tests exist."
            exit 0
          fi

          for entrypoint in $entrypoints; do
            component_dir="$(dirname "$(dirname "$(dirname "$entrypoint")")")"

            if [ ! -x "$entrypoint" ]; then
              echo "CI unit test entrypoint is not executable: $entrypoint"
              echo "Run: chmod +x $entrypoint"
              exit 1
            fi

            echo "Running unit tests for $component_dir"
            set +e
            (
              cd "$component_dir"
              ./scripts/ci/unit-test.sh
            )
            status=$?
            set -e

            if [ "$status" -ne 0 ]; then
              echo "Unit tests failed for $component_dir with exit code $status"
              print_node_diagnostics "$component_dir"
              print_npm_debug_logs "$component_dir"
              exit "$status"
            fi
          done

      - name: Upload npm diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs-${{ github.run_id }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
