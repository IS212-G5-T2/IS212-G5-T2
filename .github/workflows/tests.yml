name: Tests

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "database/**"
      - "docker-compose/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-unit-tests:
    name: Component Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run frontend and backend unit tests
        shell: bash
        run: |
          ./scripts/ci/unit-test.sh

  backend-e2e-tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://spm:spm_dev_password@127.0.0.1:5432/spm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build local PostgreSQL image
        run: docker build -t spm-postgresql ./database/postgresql

      - name: Start PostgreSQL
        run: |
          docker run -d --name spm-postgres \
            -e POSTGRES_USER=spm \
            -e POSTGRES_PASSWORD=spm_dev_password \
            -e POSTGRES_DB=spm \
            -p 5432:5432 \
            spm-postgresql

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            # The official image briefly starts a temporary server to run its
            # init scripts. It accepts pg_isready probes, then shuts down;
            # wait for that phase to finish and for the final server to listen.
            if docker logs spm-postgres 2>&1 | grep -q 'PostgreSQL init process complete; ready for start up.' \
              && docker exec spm-postgres pg_isready -U spm -d spm; then
              exit 0
            fi
            sleep 1
          done
          docker logs spm-postgres
          exit 1

      - name: Apply draft schema migration
        run: node scripts/migrate-drafts.mjs
        working-directory: backend

      - name: Run backend E2E tests
        run: npm run test:e2e
        working-directory: backend

      - name: Show PostgreSQL logs after E2E failure
        if: failure()
        run: docker logs spm-postgres

      - name: Remove PostgreSQL test container
        if: always()
        run: docker rm -f spm-postgres || true
