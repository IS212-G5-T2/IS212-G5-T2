name: Tests

on:
  pull_request:
    branches:
      - dev
      - main
      # Subtask pull requests stack into an integration branch for their parent ticket rather than
      # targeting dev directly. Without this pattern those pull requests run no checks at all, so
      # the work is only ever tested after it has already been merged once.
      - "test/SPM-*"
    paths:
      - "frontend/**"
      - "backend/**"
      - "database/**"
      - "docker-compose/**"
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. Pushing a fixup supersedes the in-flight run instead of leaving two sets of
# results on the same pull request and paying for both.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-unit-tests:
    name: Component Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run component unit test entrypoints
        shell: bash
        run: |
          set -eu

          collect_failure_diagnostics() {
            local component_dir="$1"
            local npm_log_dir="${NPM_CONFIG_CACHE:-$HOME/.npm}/_logs"
            local artifact_dir="$GITHUB_WORKSPACE/ci-diagnostics/$component_dir"

            mkdir -p "$artifact_dir"
            {
              echo "Git commit: $(git rev-parse HEAD)"
              echo "Node version: $(node --version)"
              echo "npm version: $(npm --version)"
              echo "legacy-peer-deps: $(npm config get legacy-peer-deps)"
              echo "strict-peer-deps: $(npm config get strict-peer-deps)"
              echo "Dependency files:"
              sha256sum "$component_dir/package.json" "$component_dir/package-lock.json"
            } > "$artifact_dir/dependency-state.txt"

            if [ -d "$npm_log_dir" ]; then
              find "$npm_log_dir" -type f -name '*-debug-*.log' -exec cp {} "$artifact_dir/" \;
            fi
          }

          entrypoints="$(
            find . \
              \( -path './.git' -o -path '*/node_modules' \) -prune -o \
              -path '*/scripts/ci/unit-test.sh' -type f -print | sort
          )"

          if [ -z "$entrypoints" ]; then
            echo "No component unit-test entrypoints found."
            echo "Add scripts/ci/unit-test.sh under an implemented app or service when tests exist."
            exit 0
          fi

          for entrypoint in $entrypoints; do
            component_dir="$(dirname "$(dirname "$(dirname "$entrypoint")")")"

            if [ ! -x "$entrypoint" ]; then
              echo "CI unit test entrypoint is not executable: $entrypoint"
              echo "Run: chmod +x $entrypoint"
              exit 1
            fi

            echo "Running unit tests for $component_dir"
            set +e
            (
              cd "$component_dir"
              ./scripts/ci/unit-test.sh
            )
            status=$?
            set -e

            if [ "$status" -ne 0 ]; then
              echo "Unit tests failed for $component_dir with exit code $status"
              collect_failure_diagnostics "$component_dir"
              exit "$status"
            fi
          done

  backend-e2e-tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No DATABASE_URL here on purpose. The suites resolve TEST_DATABASE_URL ?? DATABASE_URL, and
    # scripts/testing/run-e2e.mjs sets DATABASE_URL to the test database for the child process, so
    # the fallback cannot reach anything else. TEST_DATABASE_URL is set below from test-db.sh.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Start the disposable test database
        # One committed definition of what a test database is (SPM-185), shared with the browser job
        # and with local runs, so CI and a developer's machine cannot drift apart. The script builds
        # database/postgresql, waits for initialisation, stamps the disposable marker the runner
        # requires, and prints the connection URL on stdout.
        run: echo "TEST_DATABASE_URL=$(./database/postgresql/scripts/test-db.sh up)" >> "$GITHUB_ENV"

      - name: Check seeded Confirmed events meet the readiness rule
        run: ./database/postgresql/scripts/test-db.sh psql -v ON_ERROR_STOP=1 < database/postgresql/checks/confirmed_readiness.sql

      - name: Run backend E2E tests
        run: npm run test:e2e
        working-directory: backend

      - name: Show PostgreSQL logs after E2E failure
        if: failure()
        run: docker logs spm-disposable-test-db || true

      - name: Remove the disposable test database
        if: always()
        run: ./database/postgresql/scripts/test-db.sh down || true
      - name: Upload npm diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs-${{ github.run_id }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  browser-e2e-tests:
    name: Browser E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build the backend
        # playwright.config.ts starts the built output (node dist/main) as one of its webServers.
        run: npm run build
        working-directory: backend

      - name: Start the disposable test database
        run: echo "TEST_DATABASE_URL=$(./database/postgresql/scripts/test-db.sh up)" >> "$GITHUB_ENV"

      - name: Smoke-test the browser fixture builders
        run: npm run test:browser-fixtures
        working-directory: backend

      - name: Typecheck the Playwright specs and fixture
        # Playwright transpiles without type-checking and tsconfig.json excludes the specs, so this is the only gate.
        run: npm run typecheck:e2e
        working-directory: frontend

      - name: Run browser E2E suite
        # The harness spawns Playwright, which starts the backend and the Vite dev server itself and
        # points them at the same disposable database. Each test resets that database and builds its own
        # fixtures (frontend/e2e/fixtures.ts); the harness no longer seeds.
        run: npm run test:browser
        working-directory: backend

      - name: Upload Playwright report, traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Show database logs after failure
        if: failure()
        run: docker logs spm-disposable-test-db || true

      - name: Remove the disposable test database
        if: always()
        run: ./database/postgresql/scripts/test-db.sh down || true
