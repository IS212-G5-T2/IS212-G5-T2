name: Branch Flow

on:
  pull_request:
    branches:
      - staging
      - main

permissions:
  contents: read

jobs:
  validate-promotion-source:
    name: Validate Promotion Source
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch flow
        shell: bash
        run: |
          set -eu

          target="${{ github.event.pull_request.base.ref || github.ref_name }}"
          source="${{ github.event.pull_request.head.ref || github.ref_name }}"

          case "$target" in
            main)
              required_source="staging"
              ;;
            staging)
              required_source="integration"
              ;;
            *)
              echo "No promotion-source rule configured for target branch: $target"
              exit 0
              ;;
          esac

          if [ "$source" != "$required_source" ]; then
            echo "Invalid promotion path."
            echo "Target branch: $target"
            echo "Source branch: $source"
            echo "Required source branch: $required_source"
            exit 1
          fi

          echo "Valid promotion path: $source -> $target"
