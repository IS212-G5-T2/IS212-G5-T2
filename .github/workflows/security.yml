name: Security

on:
  push:
    branches:
      - staging
    paths:
      - "apps/**"
      - "services/**"
      - ".github/workflows/security.yml"
  pull_request:
    branches:
      - staging
    paths:
      - "apps/**"
      - "services/**"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  frontend-codeql:
    name: Frontend CodeQL
    runs-on: ubuntu-latest
    if: github.ref_name == 'staging' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          source-root: apps/frontend

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  backend-codeql:
    name: Backend CodeQL
    runs-on: ubuntu-latest
    if: github.ref_name == 'staging' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          source-root: services/backend

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    if: github.ref_name == 'staging' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        shell: bash
        run: |
          set -eu

          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --verbose --redact
