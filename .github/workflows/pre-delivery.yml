name: Pre-Delivery

# Mirrors delivery.yml for pull requests: builds the same release bundle this change would ship if
# merged, then runs the same smoke tiers against it. Catches packaging-time bugs (missing files in
# the archive, broken `node dist/main` startup, bad production lockfile) on the PR instead of after
# the push to main, where delivery.yml would otherwise be the first place they show up.
#
# No long-term artifact retention. The archive is uploaded with a 1-day retention so a failing run
# can be downloaded and inspected locally, then it ages out — only delivery.yml on main keeps the
# 30-day deliverable.

on:
  pull_request:
    branches:
      - main
      - dev
      - "test/SPM-*"
    paths:
      - "frontend/**"
      - "backend/**"
      - "database/**"
      - "docker-compose/**"
      - ".github/workflows/pre-delivery.yml"
      - ".github/workflows/delivery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      bundle: ${{ steps.assemble.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Assemble the release bundle
        id: assemble
        shell: bash
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short HEAD)"
          name="connectsphere-pr-${short_sha}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          staging="${RUNNER_TEMP:?}/${name:?}"
          mkdir -p "$staging/frontend" "$staging/backend"

          cp -R frontend/dist "$staging/frontend/dist"
          cp -R backend/dist "$staging/backend/dist"
          cp backend/package.json backend/package-lock.json "$staging/backend/"
          cp -R database "$staging/database"
          tar -cf - --exclude='.env' docker-compose | tar -xf - -C "$staging"

          cat > "$staging/BUILD-INFO.txt" <<INFO
          ConnectSphere PR pre-delivery bundle
          ====================================
          Commit      : $(git rev-parse HEAD)
          Short SHA   : $short_sha
          PR ref      : $GITHUB_REF_NAME
          Run         : #$GITHUB_RUN_NUMBER ($GITHUB_RUN_ID)
          Built at    : $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          INFO

          # actions/upload-artifact@v4 always wraps the uploaded contents in its own .zip the
          # viewer downloads, so uploading a .zip gave people a double-nested archive. Upload the
          # staged directory directly and the download extracts straight to the bundle layout.
          echo "dir=${RUNNER_TEMP}/${name}" >> "$GITHUB_OUTPUT"

      - name: Upload the pre-delivery bundle (short retention)
        # Retained only so a failing smoke run can be downloaded and reproduced locally. The real
        # deliverable is produced by delivery.yml on push to main.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.assemble.outputs.name }}
          path: ${{ steps.assemble.outputs.dir }}
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Smoke test the pre-delivery bundle
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SPM_TEST_DB_PORT: "55433"
      SPM_TEST_DB_CONTAINER: spm-pr-smoke-db
      BACKEND_PORT: "8080"
      FRONTEND_PORT: "5173"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies (test tooling)
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies (test tooling)
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Smoke tier 1 - unit tests
        run: npm run test:smoke:unit
        working-directory: backend

      - name: Download the pre-delivery bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.bundle }}
          path: ${{ runner.temp }}/smoke-download

      - name: Point BUNDLE_DIR at the downloaded bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/smoke-download"
          test -f "$bundle/backend/dist/main.js"
          test -f "$bundle/frontend/dist/index.html"
          echo "BUNDLE_DIR=$bundle" >> "$GITHUB_ENV"
          cat "$bundle/BUILD-INFO.txt"

      - name: Install production dependencies of the unpacked backend
        run: npm ci --omit=dev
        working-directory: ${{ env.BUNDLE_DIR }}/backend

      - name: Start the disposable test database
        run: echo "TEST_DATABASE_URL=$(./database/postgresql/scripts/test-db.sh up)" >> "$GITHUB_ENV"

      - name: Smoke tier 2 - backend integration tests
        run: npm run test:smoke:integration
        working-directory: backend

      - name: Recreate the disposable test database
        run: |
          ./database/postgresql/scripts/test-db.sh down
          echo "TEST_DATABASE_URL=$(./database/postgresql/scripts/test-db.sh up)" >> "$GITHUB_ENV"

      - name: Start the packaged backend and frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/smoke-logs"

          (
            cd "$BUNDLE_DIR/backend"
            DATABASE_URL="$TEST_DATABASE_URL" PORT="$BACKEND_PORT" \
              FRONTEND_ORIGIN="http://localhost:${FRONTEND_PORT}" \
              TENTATIVE_HOLD_EXPIRY_INTERVAL_MS=1000 \
              setsid nohup node dist/main > "${RUNNER_TEMP}/smoke-logs/backend.log" 2>&1 &
          )

          (
            cd frontend
            setsid nohup npx vite preview --outDir "$BUNDLE_DIR/frontend/dist" \
              --port "$FRONTEND_PORT" --strictPort > "${RUNNER_TEMP}/smoke-logs/frontend.log" 2>&1 &
          )

          for url in "http://127.0.0.1:${BACKEND_PORT}/healthz" "http://localhost:${FRONTEND_PORT}/"; do
            for i in $(seq 1 60); do
              curl -fsS -o /dev/null "$url" && break
              [ "$i" -eq 60 ] && { echo "Timed out waiting for $url"; tail -n 40 "${RUNNER_TEMP}"/smoke-logs/*.log; exit 1; }
              sleep 1
            done
          done

      - name: Smoke tier 3 - P0 browser tests
        run: npm run test:browser -- --grep @P0
        working-directory: backend
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"

      - name: Upload Playwright report, traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/smoke-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Show database logs after failure
        if: failure()
        run: docker logs spm-pr-smoke-db || true

      - name: Print local repro command on failure
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
          BUNDLE: ${{ needs.package.outputs.bundle }}
        run: |
          cat <<'EOF'
          ----------------------------------------------------------------
          To reproduce locally against the same bundle:
          EOF
          printf '  gh run download %s --name %s --dir %s\n' "$RUN_ID" "$BUNDLE" "$BUNDLE"
          printf '  cd %s/backend && npm ci --omit=dev\n' "$BUNDLE"
          cat <<'EOF'
            TEST_DATABASE_URL=$(database/postgresql/scripts/test-db.sh up) \
              npm run test:smoke:integration
          ----------------------------------------------------------------
          EOF

      - name: Stop the stack and remove the disposable test database
        if: always()
        run: |
          pkill -f "dist/main" || true
          pkill -f "vite preview" || true
          ./database/postgresql/scripts/test-db.sh down || true
