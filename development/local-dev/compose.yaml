name: spm-local

services:
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public
      - spm
    restart: unless-stopped

  frontend:
    build:
      context: ../../apps/frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    volumes:
      - ../../apps/frontend:/app
      - frontend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - public
      - spm
    restart: unless-stopped

  backend:
    build:
      context: ../../services/backend
    env_file:
      - .env.example
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      gcs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - spm
    restart: unless-stopped

  postgres:
    build:
      context: ../database/postgresql
    env_file:
      - .env.example
      - path: .env
        required: false
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../services/backend/migrations/001_event_drafts.sql:/docker-entrypoint-initdb.d/004_event_drafts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - spm
    restart: unless-stopped

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    env_file:
      - .env.example
      - path: .env
        required: false
    command:
      - sh
      - -c
      - gcloud beta emulators pubsub start --project="$${PROJECT_ID:-local-spm}" --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    networks:
      - spm
    restart: unless-stopped

  pubsub-init:
    image: curlimages/curl:8.11.1
    env_file:
      - .env.example
      - path: .env
        required: false
    depends_on:
      - pubsub-emulator
    command:
      - sh
      - /scripts/init-pubsub.sh
    volumes:
      - ./scripts/init-pubsub.sh:/scripts/init-pubsub.sh:ro
    networks:
      - spm
    restart: "no"

  gcs:
    image: fsouza/fake-gcs-server:1.52.3
    command:
      - -scheme
      - http
      - -host
      - 0.0.0.0
      - -port
      - "4443"
      - -external-url
      - http://localhost:4443
      - -data
      - /data
    ports:
      - "4443:4443"
    volumes:
      - gcs-data:/data
    networks:
      - spm
    restart: unless-stopped

  gcs-init:
    image: curlimages/curl:8.11.1
    env_file:
      - .env.example
      - path: .env
        required: false
    depends_on:
      - gcs
    command:
      - sh
      - /scripts/init-gcs.sh
    volumes:
      - ./scripts/init-gcs.sh:/scripts/init-gcs.sh:ro
    networks:
      - spm
    restart: "no"

  db-admin:
    image: adminer:4
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - spm
    restart: unless-stopped

networks:
  public:
  spm:
    internal: false

volumes:
  frontend-node-modules:
  postgres-data:
  gcs-data:
