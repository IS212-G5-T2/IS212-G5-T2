name: spm-local

services:
  firebase-auth:
    build:
      context: ../..
      dockerfile: development/local-dev/firebase/Dockerfile
    ports:
      - "9099:9099"
    networks:
      - spm
    restart: unless-stopped

  frontend:
    build:
      context: ../../apps/frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-fake-api-key}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-demo-is212.firebaseapp.com}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-demo-is212}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-demo-is212.appspot.com}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-000000000000}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-1:000000000000:web:local}
      VITE_USE_FIREBASE_AUTH_EMULATOR: "true"
      VITE_FIREBASE_AUTH_EMULATOR_URL: http://localhost:9099
    ports:
      - "5173:5173"
    volumes:
      - ../../apps/frontend:/app
      - frontend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - spm
    restart: unless-stopped

  backend:
    build:
      context: ../../services/backend
    env_file:
      - .env.example
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      firebase-auth:
        condition: service_started
    environment:
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      GCLOUD_PROJECT: demo-is212
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - spm
    restart: unless-stopped

  postgres:
    build:
      context: ../database/postgresql
    env_file:
      - .env.example
      - path: .env
        required: false
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - spm
    restart: unless-stopped

networks:
  spm:
    internal: false

volumes:
  frontend-node-modules:
  postgres-data:
