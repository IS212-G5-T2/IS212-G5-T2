name: spm-local

services:
  frontend:
    build:
      context: ../frontend
    env_file:
      - .env.example
      - path: .env
        required: false
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      # Vite's first in-container response can exceed three seconds on Windows/Docker.
      timeout: 10s
      retries: 6
      start_period: 10s
    networks:
      - spm
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    environment:
      - PORT=8080
    env_file:
      - .env.example
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - spm
    restart: unless-stopped

  postgres:
    build:
      context: ../database/postgresql
    env_file:
      - .env.example
      - path: .env
        required: false
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The local stack is what people look at, so it initialises with the demo dataset instead of
      # init/'s test fixtures. The image already carries init/ 001-003 in this directory; the
      # entrypoint runs the directory in sorted order, so this file runs last on a fresh volume and
      # replaces the sample events, venues, equipment and accounts that 002 seeded. init/'s
      # reference catalogues (roles, permissions, facilities, layouts, accessibility) survive,
      # because demo_seed.sql looks them up by name rather than creating them.
      #
      # Deliberately NOT part of init/: the disposable test database is built from the same image
      # without this mount, so every suite keeps 002's fixed accounts and ids. Those are what the
      # backend and Playwright tests authenticate and assert against; swapping them there would
      # break every login.
      #
      # Only runs when the volume is created (docker compose down -v). demo_seed.sql dates are
      # relative to the moment it runs, so recreate the volume, or re-run the file by hand, shortly
      # before a demo to keep them current. Accounts here are @connectsphere.sg, not the
      # @connectsphere.test ones init/ seeds.
      - ../database/postgresql/demo/demo_seed.sql:/docker-entrypoint-initdb.d/900_demo_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - spm
    restart: unless-stopped

networks:
  spm:
    internal: false

volumes:
  frontend-node-modules:
  postgres-data:
